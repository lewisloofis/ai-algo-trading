# Operational deadlines tracked for the repo.
# Run: python calendar/check_deadlines.py
# Lead window default: 30 days before deadline.

deadlines:
  - id: chartbit-intraday-repull
    due: "2026-11-26"
    lead_days: 30
    desc: >
      Re-pull chartbit intraday store before the rolling ~90-day window
      leaves a permanent gap. RECURRING - after each successful pull, roll
      this date to (last stored date + 90d - 7d buffer). Last pulled
      2026-09-04; store now covers 2026-03-25 to 2026-09-04 (108 trading
      days for the four core names, 62 for BREN/RAJA/RATU seeded that day).
      Run, with SB_BEARER_TOKEN in the environment (never as an argv flag):
      cd research && python -m screener.intraday_store snapshot
      --symbols PTRO,BRPT,TPIA,ENRG,BREN,RAJA,RATU
      Better: run it daily from cron so this deadline never binds.

  - id: holiday-refresh-2027
    due: "2026-12-05"
    lead_days: 30
    desc: >
      Transcribe the 2027 IDX holiday schedule from the official image at
      idx.co.id (Tentang BEI → Jadwal Libur Bursa) into calendar/idx_holidays.json
      and collector/internal/calendar/idx_holidays.json. Verify trading-day count
      matches IDX published JUMLAH HARI BURSA. Set provisional: false after
      reconciliation.
      THEN REBUILD AND REDEPLOY THE COLLECTOR - idx_holidays.json is compiled
      into the binary via //go:embed (collector/internal/calendar/calendar.go:12),
      so editing the JSON alone changes NOTHING on the running box. This is
      exactly the W0.4 failure mode: a stale 2026-06-19 artifact kept booting and
      shipping heartbeat segments on 2026-08-17 and 2026-08-25 because the
      holiday self-skip it needed was only ever in the repo. Redeploy with:
      make build-linux-arm64 && aws s3 cp bin/linux-arm64/collector
      s3://marketdata-047915756052/artifacts/collector
      Back up the current artifact to a .bak-YYYYMMDD key first, then confirm
      with: python scripts/collector_healthcheck.py (artifact age must read ~0d).
      The two JSON copies must stay byte-identical - verify with shasum -a 256.

